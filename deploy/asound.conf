# ALSA config for the show Pi: software mixing (dmix), so the engine's
# concurrent audio layers (loop + bg + accents + transition stingers) can
# all sound at once. Pi OS Lite has bare ALSA — without this, the second
# simultaneous player fails with "Device or resource busy" and layers
# silently drop.
#
# Install:  sudo cp deploy/asound.conf /etc/asound.conf
# Then verify mixing works (both must play, overlapped):
#   aplay assets/some.wav & aplay assets/other.wav
#
# Card selection: run `aplay -l`. The 3.5mm headphone jack is usually
# card 0 ("Headphones"); a USB DAC typically enumerates as card 1. Set the
# number in BOTH places below.

pcm.!default {
    type asym
    playback.pcm "plug:volcano_mix"   # plug = auto rate/format conversion
    capture.pcm "null"                # no mic on this rig
}

pcm.volcano_mix {
    type dmix
    ipc_key 5978293                   # any unique number; shared by all players
    slave {
        pcm "hw:0,0"                  # card,device from `aplay -l`
        rate 44100
        format S16_LE
        period_size 1024
        buffer_size 8192
    }
}

ctl.!default {
    type hw
    card 0                            # keep in sync with the slave pcm card
}
