# BENCH-TEST profile — supervised hardware checks ONLY. Never the show config.
#
#   uv run --env-file .env dmx-volcano --real /dev/enttec --config config/bench.toml
#   (--env-file loads DMX_ARM_PIN; without it the page refuses to arm)
#
# Differences from show.toml, all in the direction of short + minimal:
#   - pyro_enabled = true so CO2 test bursts can be armed (invariant 3 is
#     satisfied because this file is only ever loaded via an explicit
#     --config flag; the systemd service loads show.toml, which stays false).
#   - CO2 bursts are 0.5s — one valve click, safe to dry-fire (no tank).
#   - imminent 5s / eruption 12s / cooldown 10s so a full manual-trigger
#     cycle takes under 30 seconds.
#   - dormant/active dwells are ~infinite: NOTHING transitions on its own;
#     every phase change during a bench session is an explicit operator act.
#   - No flame in the show cycle (the eruption is CO2 only); fire it from the
#     test console. The H-E01A safety channel is driven only under a
#     SafetyGate permit, identical to the show path.
#   - After any CO2 burst the gate refuses flame for 60s (lingering CO2 can
#     stop it igniting) — test flame first, or wait out the countdown.

[show]
frame_rate = 40
pyro_enabled = true    # BENCH ONLY — see header
log_dir = "logs"

[phases]
p_erupt = 1.0            # bench: never fizzle
imminent_duration = 5.0
eruption_duration = 12.0
cooldown = 10.0

[phases.dwell.dormant]
t_min = 86400.0          # ~infinite: no self-transitions on the bench
t_max = 86401.0
k = 2.0
scale = 86400.0

[phases.dwell.active]
t_min = 86400.0
t_max = 86401.0
k = 2.0
scale = 86400.0

[co2]
capacity_kg = 9.0
rate_kg_per_s = 0.35
warn_remaining_fraction = 0.15
state_file = "var/co2_tank.json"

[alerts]
phone_numbers = []       # bench: never text anyone

# Looks: show.py/lighting.py defaults (same as show.toml), fogger kept quiet
# unless tested explicitly.
[looks.active]
fog = 0

[looks.imminent]
fog = 0

[looks.eruption]
fog = 0

# Eruption timeline, bench edition: one short CO2 pop, PAR strobe from the
# phase render. No fog, no sound assets required.
[[cues.eruption]]
t = 2.0
action = "co2_burst"
duration = 0.5

# Fixture addressing — the BENCH CHAIN as physically wired (2026-09-11), NOT
# the show.toml plan. DMX chain ORDER is irrelevant (docs/DMX_ADDRESSING.md);
# only these start addresses must match what each fixture's own display is
# set to. Read them off the device before every session.
#
#   device            display   address
#   H-E01A flame      d200      200  (safety = 200, fire = 201)
#   MK-C09 CO2        d400      400  (jet = 400)
#   PAR par1          A010       10  (CO2 moved to d400 to free the low block)
#   PAR par2          A020       20
#   MK-F01 fogger     d300      300  (fog = 300; on the chain as of 2026-10-23)
#
# The phase looks keep fog at 0 here; run it from the test console's fog
# slider when you mean to.

[fixtures.flame]
address = 200
channels = { safety = 0, fire = 1 }
pyro = true
position = [0.0, 0.5]

[fixtures.co2]
address = 400
channels = { jet = 0 }
pyro = true
position = [0.0, -0.5]

[fixtures.fogger]
address = 300
channels = { fog = 0, red = 1, green = 2, blue = 3, strobe = 4, auto = 5, auto_speed = 6 }
position = [0.0, 0.0]

[fixtures.par1]
address = 10
channels = { dimmer = 0, red = 1, green = 2, blue = 3 }
position = [1.5, 1.5]

[fixtures.par2]
address = 20
channels = { dimmer = 0, red = 1, green = 2, blue = 3 }
position = [-1.5, 1.5]
