# Show configuration — the tuning surface. Edit and restart; no code changes.
# Times in seconds, positions in meters (top-down, volcano center = 0,0).

[show]
frame_rate = 40
pyro_enabled = false   # software arm default: ALWAYS false; armed nightly via web UI
log_dir = "logs"

[phases]
p_erupt = 0.7          # from active: escalate vs. fizzle back to dormant
imminent_duration = 30.0  # fixed warning phase before every eruption
eruption_duration = 10.0  # CO2 is the scarce resource: two bursts fill it
cooldown = 60.0

# Tuned for ~5 automatic eruptions/hour (mean dormant ~390s, active ~80s,
# 70% escalate, +40s imminent/eruption). Manual triggers come on top.
[phases.dwell.dormant]
t_min = 180.0
t_max = 780.0
k = 2.0                # Weibull shape > 1: rising hazard
scale = 430.0

[phases.dwell.active]
t_min = 30.0
t_max = 180.0
k = 2.0
scale = 90.0

# --- CO2 tank tracking --------------------------------------------------
# PLACEHOLDERS from MOKA's MK-C09 FAQ: a 40L cylinder holds ~23 kg and
# sprays for 40-50s, i.e. ~0.5 kg/s. Our tanks are unweighed. The rehearsal
# night measures it: the log's granted co2_burst durations summed over one
# tank give seconds/tank; set rate_kg_per_s = capacity_kg / that.
# Budget: 5 eruptions/h x 4h x 4 nights = 80 eruptions; at 2.5s of CO2 per
# eruption that is 200s of spray. Usage persists in state_file across
# restarts; reset via the web UI when you swap tanks.

[co2]
capacity_kg = 23.0            # 40L / 50 lb siphon cylinder, per MOKA FAQ
rate_kg_per_s = 0.5           # MEASURE ME (rehearsal night)
warn_remaining_fraction = 0.15
state_file = "var/co2_tank.json"

# --- Alerts -------------------------------------------------------------
# Operator phone numbers (E.164). SMS goes out via Twilio; credentials come
# from env vars TWILIO_ACCOUNT_SID / TWILIO_AUTH_TOKEN / TWILIO_FROM_NUMBER
# (on the Pi: the systemd EnvironmentFile). Unconfigured -> alerts are
# logged only, so dev machines never text anyone. Do NOT commit real creds.

[alerts]
phone_numbers = [
    "+15555550100",   # replace with real operator numbers
    "+15555550101",
]

[alerts.twilio]
account_sid = ""
auth_token = ""
from_number = ""

# --- Audio --------------------------------------------------------------
# Files are relative to assets/. assets/sounds/ is rendered by
# tools/prep_audio.py from the raw downloads in assets/raw/ — leveled per
# phase, filtered for the sub, loops seamless (docs/AUDIO.md). Change a sound
# in tools/audio_prep.toml and re-render; don't hand-edit assets/sounds/.
# Every pool picks at random each time it fires, never the same file twice
# in a row while the pool has alternatives.
#
# Roles within a phase:
#   start  = one-shot on phase entry
#   loop   = the base bed; respawns when it ends (multi-file pools re-pick
#            per cycle, so the bed evolves)
#   bg     = second looping texture layer
#   accent = one-shots sprinkled at random accent_interval = [min, max]
#            seconds while the phase runs
# loop/bg stop at a phase change; one-shots (start, accent, stingers, cue
# sounds) ring out to their own faded end.

[audio.phases.dormant]
loop = ["sounds/dormant/bed_bubbling.wav", "sounds/dormant/bed_bubbling_deep.wav"]
bg = ["sounds/dormant/bg_fire_whoosh.wav"]
accent = [
  "sounds/dormant/accent_interior_rumble_1.wav",
  "sounds/dormant/accent_interior_rumble_2.wav",
  "sounds/dormant/accent_distant_explosion.wav",
  "sounds/dormant/accent_wind_fire_1.wav",
  "sounds/dormant/accent_wind_fire_2.wav",
  "sounds/dormant/accent_dread.wav",
]
accent_interval = [30.0, 90.0]    # sparse: dormant should feel mostly asleep

[audio.phases.active]
loop = [
  "sounds/active/bed_lava_rumble.wav",
  "sounds/active/bed_magma_growl.wav",
  "sounds/active/bed_magma_muted.wav",
]
bg = ["sounds/active/bg_magma_flow.wav"]
accent = [
  "sounds/active/accent_cracking.wav",
  "sounds/active/accent_fireball_whump.wav",
  "sounds/active/accent_close_explosion.wav",
]
accent_interval = [15.0, 40.0]

[audio.phases.imminent]
loop = ["sounds/imminent/bed_lava_chaos_1.wav", "sounds/imminent/bed_lava_chaos_2.wav"]
bg = ["sounds/imminent/bg_gurgle.wav"]
accent = [
  "sounds/imminent/accent_thunder_hit.wav",
  "sounds/imminent/accent_thunder_1.wav",
  "sounds/imminent/accent_thunder_2.wav",
  "sounds/imminent/accent_crackle.wav",
]
accent_interval = [6.0, 12.0]     # dense: 30s phase, guarantee a few hits

# The rest of the eruption's sound is the cue timeline below (aftershocks,
# the big burst); its start tail rings into the cooldown.
[audio.phases.eruption]
start = [
  "sounds/eruption/start_huge_boomy.wav",
  "sounds/eruption/start_big_explosion.wav",
  "sounds/eruption/start_flame_burst.wav",
]
bg = ["sounds/eruption/bg_earthquake.wav"]

# Stingers layered over the new phase's audio when the show makes exactly
# this move. Keys are "<from>-><to>". imminent->eruption has none on
# purpose: the eruption start explosion is that moment.
[audio.transitions]
"dormant->active" = [
  "sounds/transitions/dormant-active_deep_boom.wav",
  "sounds/transitions/dormant-active_abyss_blast.wav",
  "sounds/transitions/dormant-active_distorted_hit.wav",
]
"active->imminent" = [
  "sounds/transitions/to-imminent_fire_rush.wav",
  "sounds/transitions/to-imminent_flame_burst.wav",
  "sounds/transitions/to-imminent_stove_blast.wav",
]
"dormant->imminent" = [           # the manual trigger
  "sounds/transitions/to-imminent_fire_rush.wav",
  "sounds/transitions/to-imminent_flame_burst.wav",
  "sounds/transitions/to-imminent_stove_blast.wav",
]
"active->dormant" = [             # the fizzle: water on lava
  "sounds/transitions/active-dormant_extinguish_1.wav",
  "sounds/transitions/active-dormant_extinguish_2.wav",
]
"eruption->dormant" = ["sounds/transitions/eruption-dormant_distant_eruption.wav"]

# --- Lighting looks -----------------------------------------------------
# Per-phase render parameters; anything set here overrides the defaults in
# lighting.py DEFAULT_LOOKS. See docs/SHOW_AUTHORING.md.

# Design principles: docs/SHOW_AUTHORING.md section 2. Every light moves on
# its own. Each phase change blacks out, sweeps a full flash par1 -> par6 in
# the phase's hit_color (default: its color), then hits the crater last.
#
# Fog: `fog` is the level, pulsed `fog_on` s on / `fog_off` s off from phase
# entry (on first). Running the pump cools the fogger's heater; run it too
# long and the MK-F01 stops itself to reheat, and DMX can't tell us when.
# Bench 2026-10-24: the fog level is proportional (64 vs 128 clearly
# differ), and at 255 the MK-F01 fogs ~14s continuous, then stalls ~45s to
# reheat. Treat the heater as a bank of ~14s of full fog refilling over 45s:
# imminent must leave it nearly full for the eruption's 10s at 255, so
# imminent fogs in short bursts. Modeled worst case (180s active, imminent,
# eruption) enters the eruption with ~12s of 255 banked.
#
# [looks.<phase>.caldera] = the crater lights + the fogger's LEDs, coloring
# the smoke. Keys missing there fall back to the phase's own keys.
# Palettes below: sulfur yellow, barium green, sulfur blue, potassium
# violet, strontium magenta.

[looks.dormant]
color = [255, 0, 0]                        # dominant: red
dimmer = [6, 255]                          # deep lows, full highs
pulse_hz = 0.13                            # breathing rate; each par strays +/-30%
accents = [[255, 70, 0], [150, 0, 255]]    # minority drift: orange, purple
accent_share = 0.3                         # ~fraction of time a par spends accented
accent_hz = 0.04                           # how often accent episodes come and go
fog = 120                                  # a thin wisp now and then
fog_on = 2.0
fog_off = 18.0

[looks.dormant.caldera]
color = [0, 60, 255]                       # dominant: sulfur blue, barely glowing
dimmer = [0, 110]
pulse_hz = 0.08
accents = [[150, 0, 255], [80, 255, 0]]    # minority: violet, green
accent_share = 0.34
accent_hz = 0.05

[looks.active]
color = [255, 80, 0]                       # dominant: orange
dimmer = [20, 255]
pulse_hz = 0.25
accents = [[255, 0, 0], [0, 255, 0]]       # minority: red, green
accent_share = 0.4
accent_hz = 0.07
fog = 180
fog_on = 3.0
fog_off = 10.0

[looks.active.caldera]
dimmer = [40, 255]
palette = [[255, 200, 0], [80, 255, 0], [0, 80, 255], [160, 0, 255], [255, 0, 140]]
hold_s = 3.0                               # each light holds a color ~3s...
fade = 0.4                                 # ...crossfading over the last 40%

[looks.imminent]
dimmer = [0, 255]
beat_hz = [0.6, 2.5]   # heartbeat accelerates from first to second over the phase
palette = [[255, 255, 255], [255, 90, 0], [255, 0, 0]]  # each beat picks one per par
hit_color = [255, 255, 255]
fog = 255
fog_on = 2.0                               # short bursts: save heat for the eruption
fog_off = 6.0

[looks.imminent.caldera]
palette = [[255, 200, 0], [80, 255, 0], [0, 80, 255], [160, 0, 255], [255, 0, 140]]  # same cascading heartbeat

[looks.eruption]
dimmer = [0, 255]
strobe_hz = 8.0                            # each par strobes +/-30% around this
palette = [[255, 60, 0], [255, 0, 0]]      # each flash picks orange or red
flash = [0.25, 1.0]                        # random brightness range per flash
hit_color = [255, 255, 255]
fog = 255                                  # full and constant: 10s only

[looks.eruption.caldera]
palette = [[255, 255, 255]]                # all white: light up the CO2
pop_hz = 3.0                               # white pops per second, per light
blast_tail = 0.4                           # white falls off over this after each CO2 cue

[looks.transition]
gap = 0.15     # blackout snap at every phase change, seconds
step = 0.07    # delay between pars in the sweep (par1 -> par6)
decay = 0.9    # each par's flash fades into the new look over this long

[looks.flame]
color = [255, 110, 0]   # every light flares to this on each flame pulse...
tail = 0.3              # ...and fades back over this long

# --- Flame patterns -----------------------------------------------------
# Flame balls in morse-like rhythms: "." = dot pulse, "-" = dash pulse,
# spaces ignored. Each pattern opens the H-E01A safety channel 0.5s before
# its first pulse and holds it through the last; fire rises only inside a
# pulse. The SafetyGate grants a pattern whole or not at all. See
# docs/SHOW_AUTHORING.md section 3.
#
# Flame belongs to the transitions and imminent; the eruption is CO2 only
# (the CO2 smothers the flame). No "eruption->..." patterns: CO2 pools in
# the crater and can stop the flame igniting, so the gate also refuses
# flame for 60s after any CO2 burst.
#
# Bench 2026-10-24: 0.15s pulses with 0.25s gaps light every time; that is
# also the gate's floor (safety.MIN_PULSE / MIN_GAP). With no gap, the third
# pulse failed to light — a pulse that fails releases unburnt LPG into the
# crater for the next one to ignite all at once.

[flame]
dot = 0.15
dash = 0.45
gap = 0.25               # dark time between pulses in a pattern
clear_before_co2 = 1.5   # the finale ends this long before the first CO2 cue

# Fired at the start of the new phase, more flame the nearer the eruption.
# "imminent->eruption" is the finale: it plays at the END of imminent.
[flame.transitions]
"dormant->active"    = ["-..-", "-.-", ".-."]
"active->dormant"    = ["."]                             # a fizzle: one weak pop
"active->imminent"   = [".--..-", "-.-.--", "--..--"]
"dormant->imminent"  = [".--..-", "-.-.--", "--..--"]    # manual trigger
"imminent->eruption" = ["...---", "-.-.--"]

# Imminent's own flame, packed between its entry pattern and the finale.
[flame.imminent]
patterns = ["-.-.", "..--..", "-..-.-", "---"]
rest = [1.0, 2.5]        # random pause between patterns, seconds

# --- Eruption cue timeline ----------------------------------------------
# t = seconds from eruption start. The eruption is CO2 + fog only. CO2 cues
# must respect the safety gate (<=4s bursts, >=5s from one burst's end to
# the next one's start — MOKA's MK-C09 limit) or they are DENIED and logged
# with granted=false. The gate wins, by design. In a 10s eruption that
# leaves room for two bursts: a pop, then the big one.
# The eruption entry roar comes from [audio.phases.eruption] start; sound
# cues are for audio sync'd to a mid-timeline moment. A sound cue's file may
# be one file or a pool (random pick, no back-to-back repeats).

[[cues.eruption]]
t = 2.5
action = "sound"
file = "sounds/eruption/cue_aftershocks.wav"

[[cues.eruption]]
t = 1.0
action = "co2_burst"
duration = 0.5           # the pop

[[cues.eruption]]
t = 6.5
action = "co2_burst"
duration = 2.0           # the big one: ends at 8.5s, lights white-out over it

[[cues.eruption]]
t = 6.5
action = "sound"           # lands with the big burst
file = [
  "sounds/eruption/cue_big_burst_underwater.wav",
  "sounds/eruption/cue_big_burst_flame.wav",
]

# --- Fixtures -----------------------------------------------------------
# Channel maps are PROVISIONAL until confirmed against printed manuals
# (DESIGN.md open items). Offsets are 0-based from the fixture's address.
#
# Addresses match the chain as physically wired (config/bench.toml, read off
# each device's display). Read them off the devices again before each night:
# a fixture whose display disagrees with this file listens to someone else's
# channels — and the SafetyGate only clamps the pyro channels listed here.
# Loading refuses any config where two fixtures share a channel.
#
#   device            display   address
#   H-E01A flame      d200      200  (safety = 200, fire = 201)
#   MK-C09 CO2        d400      400  (jet = 400)
#   par1..par6        A010..A060  10, 20 … 60  (7ch mode; 10-channel blocks)
#   caldera_left      A100      100  (inside the crater, back-left)
#   caldera_right     A110      110  (inside the crater, back-right)
#   MK-F01 fogger     d300      300  (300-306, 7ch; on the chain as of 2026-10-23)

[fixtures.flame]
address = 200
channels = { safety = 0, fire = 1 }   # H-E01A: safety ch must hold 102-153 to arm
pyro = true
position = [0.0, 0.5]

[fixtures.co2]
address = 400
channels = { jet = 0 }                # MK-C09: single trigger channel
pyro = true
position = [0.0, -0.5]

[fixtures.fogger]
address = 300
# MK-F01, 7ch per the MOKA product page: fog, R, G, B, LED strobe, LED
# autorun, autorun speed. Value ranges are not published; strobe/autorun are
# assumed off at 0 (the engine leaves them at 0) — confirm on the bench.
channels = { fog = 0, red = 1, green = 2, blue = 3, strobe = 4, auto = 5, auto_speed = 6 }
position = [0.0, 0.0]

# 60-LED RGB pars (CHEGIT, 7ch) — confirm channel order on the bench.
# Semicircle open at the back, as seen from the audience: sides ~2.5 m out,
# front three ~2 m. Plan axes: +x = audience's right, +y = away from the
# audience (the front of the volcano is -y). tilt = beam degrees above
# horizontal (preview only): par1 is nearly face-on, rising toward par6;
# the uneven steps mirror the hand-aimed rig.
[fixtures.par1]
address = 10
channels = { dimmer = 0, red = 1, green = 2, blue = 3 }
position = [-1.77, 1.77]  # back-left
tilt = 14

[fixtures.par2]
address = 20
channels = { dimmer = 0, red = 1, green = 2, blue = 3 }
position = [-2.5, 0.0]    # left
tilt = 23

[fixtures.par3]
address = 30
channels = { dimmer = 0, red = 1, green = 2, blue = 3 }
position = [-1.41, -1.41] # front-left
tilt = 35

[fixtures.par4]
address = 40
channels = { dimmer = 0, red = 1, green = 2, blue = 3 }
position = [0.0, -2.0]    # front
tilt = 41

[fixtures.par5]
address = 50
channels = { dimmer = 0, red = 1, green = 2, blue = 3 }
position = [1.41, -1.41]  # front-right
tilt = 53

[fixtures.par6]
address = 60
channels = { dimmer = 0, red = 1, green = 2, blue = 3 }
position = [2.5, 0.0]     # right
tilt = 60

# Caldera lights: two more RGB pars inside the top of the cone with the
# flame/CO2/fogger, for the interior glow and for blasting white through the
# CO2 plume. Assumed to be the same 7ch model as par1-par6 — confirm the
# channel order on the bench. Both sit at the back of the crater, angled
# diagonally across it toward the audience and tilted up; A110 tilts up a
# little more than A100 (tilt values are eyeballed, preview only).
[fixtures.caldera_left]
address = 100
channels = { dimmer = 0, red = 1, green = 2, blue = 3 }
position = [-0.5, 0.4]    # back-left of the crater
tilt = 30

[fixtures.caldera_right]
address = 110
channels = { dimmer = 0, red = 1, green = 2, blue = 3 }
position = [0.5, 0.4]     # back-right of the crater
tilt = 38
