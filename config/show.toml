# Show configuration — the tuning surface. Edit and restart; no code changes.
# Times in seconds, positions in meters (top-down, volcano center = 0,0).

[show]
frame_rate = 40
pyro_enabled = false   # software arm default: ALWAYS false; armed nightly via web UI
log_dir = "logs"

[phases]
p_erupt = 0.7          # from active: escalate vs. fizzle back to dormant
imminent_duration = 30.0  # fixed warning phase before every eruption
eruption_duration = 20.0
cooldown = 60.0

[phases.dwell.dormant]
t_min = 120.0
t_max = 600.0
k = 2.0                # Weibull shape > 1: rising hazard
scale = 300.0

[phases.dwell.active]
t_min = 30.0
t_max = 180.0
k = 2.0
scale = 90.0

# --- CO2 tank tracking --------------------------------------------------
# rate_kg_per_s is a PLACEHOLDER: measure it (weigh tank, timed 4s burst,
# weigh again) and update. Usage persists in state_file across restarts;
# reset via the web UI when you swap tanks.

[co2]
capacity_kg = 9.0             # 20 lb siphon tank ~= 9 kg liquid CO2
rate_kg_per_s = 0.35          # MEASURE ME
warn_remaining_fraction = 0.15
state_file = "var/co2_tank.json"

# --- Alerts -------------------------------------------------------------
# Operator phone numbers (E.164). SMS goes out via Twilio; credentials come
# from env vars TWILIO_ACCOUNT_SID / TWILIO_AUTH_TOKEN / TWILIO_FROM_NUMBER
# (on the Pi: the systemd EnvironmentFile). Unconfigured -> alerts are
# logged only, so dev machines never text anyone. Do NOT commit real creds.

[alerts]
phone_numbers = [
    "+15555550100",   # replace with real operator numbers
    "+15555550101",
]

[alerts.twilio]
account_sid = ""
auth_token = ""
from_number = ""

# --- Audio --------------------------------------------------------------
# Files are relative to assets/ (drop them there, or import via the web
# page's Audio panel). Every pool picks at random each time it fires, never
# the same file twice in a row while the pool has alternatives. Layer
# loudness is baked into the files (normalize the corpus; there is no
# per-layer gain). Eruption's big sync'd sound belongs in the cue timeline
# below instead.
#
# Roles within a phase:
#   start  = one-shot on phase entry
#   loop   = the base bed; respawns when it ends (multi-file pools re-pick
#            per cycle, so the bed evolves)
#   bg     = second looping texture layer
#   accent = one-shots sprinkled at random accent_interval = [min, max]
#            seconds while the phase runs

[audio.phases.dormant]
loop = ["sounds/dormant/dormant_loop_1.wav", "sounds/dormant/dormant_loop_2.wav"]
accent = ["sounds/dormant/dormant_accent_1.wav"]
accent_interval = [45.0, 120.0]   # sparse: dormant should feel mostly asleep

[audio.phases.active]
loop = ["sounds/active/active_loop_1.wav", "sounds/active/active_loop_2.wav"]

[audio.phases.imminent]
loop = ["sounds/imminent/imminent_loop_1.wav"]
accent = ["sounds/imminent/imminent_accent_1.wav", "sounds/imminent/imminent_accent_2.wav"]
accent_interval = [6.0, 12.0]     # dense: 30s phase, guarantee a few hits

[audio.phases.eruption]
start = ["sounds/eruption/eruption_start_1.wav", "sounds/eruption/eruption_start_2.wav"]
accent = ["sounds/eruption/eruption_accent_1.wav"]
accent_interval = [6.0, 10.0]

# Stingers layered over the new phase's audio when the show makes exactly
# this move — the audible cue that the volcano is advancing. Keys are
# "<from>-><to>" over dormant / active / imminent / eruption. No stinger
# files in the corpus yet — add e.g.:
#   [audio.transitions]
#   "dormant->active" = ["sounds/transitions/stir.wav"]

# --- Lighting looks -----------------------------------------------------
# Per-phase render parameters; anything set here overrides the defaults in
# show.py DEFAULT_LOOKS. See docs/SHOW_AUTHORING.md.

[looks.dormant]
color = [255, 0, 0]
dimmer = [60, 100]
pulse_hz = 0.13

[looks.active]
color = [255, 40, 0]
dimmer = [120, 200]
pulse_hz = 0.13
fog = 180

[looks.imminent]
color = [255, 190, 80]
dimmer = [0, 255]
beat_hz = [0.6, 2.5]   # heartbeat accelerates from first to second over the phase
fog = 255

[looks.eruption]
color = [255, 60, 0]
dimmer = [40, 255]
strobe_hz = 8.0

# --- Eruption cue timeline ----------------------------------------------
# t = seconds from eruption start. Pyro cues must respect the safety gate
# (flame: <=3.0s bursts, >=3s gap; co2: <=4s bursts, >=5s gap) or they are
# DENIED. A flame cue opens the H-E01A safety channel at t and fires 0.5s
# later (the machine ignores fire unless safety is already open), so the
# flame is visible over [t+0.5, t+0.5+duration).
# DENIED and logged with granted=false. The gate wins, by design.
# The eruption entry roar comes from [audio.phases.eruption] start; use a
# sound cue here only for audio sync'd to a mid-timeline moment.

[[cues.eruption]]
t = 2.0
action = "fog"
level = 255

[[cues.eruption]]
t = 4.0
action = "co2_burst"
duration = 1.5

[[cues.eruption]]
t = 5.0
action = "flame_burst"
duration = 0.8

[[cues.eruption]]
t = 9.0
action = "flame_burst"
duration = 0.8

# --- Fixtures -----------------------------------------------------------
# Channel maps are PROVISIONAL until confirmed against printed manuals
# (DESIGN.md open items). Offsets are 0-based from the fixture's address.
#
# Addresses match the chain as physically wired (config/bench.toml, read off
# each device's display). Read them off the devices again before each night:
# a fixture whose display disagrees with this file listens to someone else's
# channels — and the SafetyGate only clamps the pyro channels listed here.
# Loading refuses any config where two fixtures share a channel.
#
#   device            display   address
#   H-E01A flame      d200      200  (safety = 200, fire = 201)
#   MK-C09 CO2        d010       10  (jet = 10)
#   PAR "light 2"     A020       20  (par2)
#   PAR "light 1"     A030       30  (par1)
#   par3..par8        A040..A090     (not yet on the chain — set on arrival)
#   MK-F01 fogger     d300      300  (not yet on the chain — set on arrival)

[fixtures.flame]
address = 200
channels = { safety = 0, fire = 1 }   # H-E01A: safety ch must hold 102-153 to arm
pyro = true
position = [0.0, 0.5]

[fixtures.co2]
address = 10
channels = { jet = 0 }                # MK-C09: single trigger channel
pyro = true
position = [0.0, -0.5]

[fixtures.fogger]
address = 300
channels = { fog = 0, red = 1, green = 2, blue = 3 }  # MK-F01: confirm, likely 8ch
position = [0.0, 0.0]

# OPPSK 36x1W RGB pars — confirm channel map from boxed manual (~7ch mode).
[fixtures.par1]
address = 30
channels = { dimmer = 0, red = 1, green = 2, blue = 3 }
position = [1.5, 1.5]

[fixtures.par2]
address = 20
channels = { dimmer = 0, red = 1, green = 2, blue = 3 }
position = [-1.5, 1.5]

[fixtures.par3]
address = 40
channels = { dimmer = 0, red = 1, green = 2, blue = 3 }
position = [1.5, -1.5]

[fixtures.par4]
address = 50
channels = { dimmer = 0, red = 1, green = 2, blue = 3 }
position = [-1.5, -1.5]

[fixtures.par5]
address = 60
channels = { dimmer = 0, red = 1, green = 2, blue = 3 }
position = [3.0, 0.0]

[fixtures.par6]
address = 70
channels = { dimmer = 0, red = 1, green = 2, blue = 3 }
position = [-3.0, 0.0]

[fixtures.par7]
address = 80
channels = { dimmer = 0, red = 1, green = 2, blue = 3 }
position = [0.0, 3.0]

[fixtures.par8]
address = 90
channels = { dimmer = 0, red = 1, green = 2, blue = 3 }
position = [0.0, -3.0]
