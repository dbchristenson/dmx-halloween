# Recipe for the show corpus — rendered by tools/prep_audio.py from
# assets/raw/ (the untouched downloads, with the notes in assets/raw/readme.md)
# into assets/sounds/, which config/show.toml's [audio] pools reference.
#
# One [[sound]] per output. Keys:
#   out          path under assets/sounds/
#   src          path under assets/raw/
#   start / end  trim window in seconds (default: whole file)
#   tier         loudness target from [tiers]
#   loop         true for beds: crossfade the tail into the head, no fades
#   fade_in / fade_out / highpass / ceiling   override [defaults]
#   layers       instead of src: [{src, start, end, at, gain, speed}, ...]
#                mixed together (at = offset s, gain = dB, speed = varispeed)

[defaults]
highpass = 30.0        # Hz: below what the PSW10 sub can play (also strips DC)
ceiling = -1.0         # dBFS sample peak after limiting
fade_in = 0.005
fade_out = 0.05
loop_crossfade = 2.0   # seconds of tail blended into the head
# Added to every tier. Layers sum in dmix and saturate past full scale: the
# worst stacks (imminent bed + bg + stinger + 3 accents; eruption start + bg
# + both cues + a ringing accent) peak ~5.5dB over the files' own peaks.
# Make the level up on the TS408's gain, never by raising this.
master = -6.0

# Integrated loudness targets (LUFS, before master). The show gets louder as
# it builds; bg sits under its phase's bed, hits (accents/stingers) on top.
[tiers]
dormant_bg = -33.0
dormant_bed = -30.0
dormant_hit = -26.0
active_bg = -27.0
active_bed = -24.0
active_hit = -20.0
imminent_bg = -22.0
imminent_bed = -19.0
imminent_hit = -15.0
eruption_bg = -16.0
eruption_tail = -15.0
eruption_hit = -12.0

